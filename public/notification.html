<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: transparent;
      overflow: hidden;
    }
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 浅色主题 */
    :root, [data-theme="light"] {
      --bg-card: #ffffff;
      --bg-header: rgba(59, 130, 246, 0.08);
      --bg-footer: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-bg: rgba(59, 130, 246, 0.1);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    
    /* 深色主题 */
    [data-theme="dark"] {
      --bg-card: #1e293b;
      --bg-header: rgba(96, 165, 250, 0.08);
      --bg-footer: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-bg: rgba(96, 165, 250, 0.1);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .notification-card {
      width: 320px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .notification-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
    }
    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-icon svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
    }
    .notification-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .notification-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-muted);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-close:hover {
      background: var(--border);
      color: var(--text);
    }
    .notification-close svg {
      width: 18px;
      height: 18px;
    }
    
    .notification-body {
      padding: 16px;
    }
    .notification-body p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }
    
    .notification-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-footer);
      border-top: 1px solid var(--border);
    }
    .notification-footer svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }
    .notification-time {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="notification-card" id="card" style="display: none;">
      <div class="notification-header">
        <div class="notification-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <span class="notification-title" id="title">EasyTimer 提醒</span>
        <button class="notification-close" onclick="closeNotification()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="notification-body">
        <p id="body">提醒内容</p>
      </div>
      <div class="notification-footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="notification-time" id="time">刚刚</span>
      </div>
    </div>
  </div>

  <script>
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;
    
    let autoCloseTimer = null;
    
    // 加载主题设置
    async function loadTheme() {
      try {
        const theme = await invoke('get_setting', { key: 'theme' });
        const resolved = theme === 'system' 
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (theme || 'light');
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }
    
    // 监听系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      loadTheme();
    });
    
    // 监听通知事件
    listen('show-notification', (event) => {
      const { title, body } = event.payload;
      showNotification(title, body);
    });
    
    function showNotification(title, body) {
      loadTheme(); // 每次显示时刷新主题
      
      const card = document.getElementById('card');
      document.getElementById('title').textContent = title || 'EasyTimer 提醒';
      document.getElementById('body').textContent = body;
      document.getElementById('time').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      
      card.style.display = 'block';
      card.style.animation = 'none';
      card.offsetHeight; // 触发重绘
      card.style.animation = 'slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
      
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      autoCloseTimer = setTimeout(closeNotification, 5000);
    }
    
    function closeNotification() {
      document.getElementById('card').style.display = 'none';
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
    }
    
    // 初始化
    loadTheme();
  </script>
</body>
</html>
